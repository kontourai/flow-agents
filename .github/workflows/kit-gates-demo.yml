name: Kit Gates Demo (Agentless)

# Proves that Flow Kit gates can be evaluated over trust-bundle evidence in CI
# with no agent in the loop, using the Release Evidence kit. The Flow CLI is the
# one this package depends on (pnpm install --frozen-lockfile), so the demo
# follows the package's Flow pin instead of a separate, drifting one.
#
# scripts/ci/release-evidence-gate-demo.sh runs validate-definition, kit
# validate, start, attach-evidence --kind trust.bundle and evaluate --exit-code
# for a verified claim (must pass) and a rejected claim (must be refused, with
# a "rejected" claim diagnostic).
#
# Triggered on: workflow_dispatch, or a PR touching kits, the engine, the
# dependency manifests, the demo script or this workflow.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kits/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/ci/release-evidence-gate-demo.sh"
      - ".github/workflows/kit-gates-demo.yml"

permissions:
  contents: read

jobs:
  release-evidence-gate-demo:
    concurrency:
      group: flow-agents-compute-1
      queue: max
      cancel-in-progress: false
    name: Release Evidence gate — verified passes, rejected is refused
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the agentless gate demo
        run: bash scripts/ci/release-evidence-gate-demo.sh
