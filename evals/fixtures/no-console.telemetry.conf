# Neutral telemetry conf for eval runs (#1094 item C).
#
# config.sh resolves a per-workspace .kontourai/telemetry-console.conf ahead of
# the user-global one, and THIS REPO HAS ONE carrying a real production endpoint
# and token. So an eval that stubs only HOME is not isolated: it will resolve
# production and can post real records from a test run. That nearly happened
# while building the receipt relay.
#
# run-baseline exports TELEMETRY_CONFIG_FILE pointing here when a caller has not
# set one, and an explicit TELEMETRY_CONFIG_FILE is the first thing config.sh
# honours — so evals default to "no console configured" and cannot reach a hub
# by forgetting. A test that needs a console points the variable at its own conf
# (see test_console_receipt_relay.sh), which still wins.
#
# Deliberately declares NO console_telemetry_url and NO console_telemetry_token.
enabled=true
channels=full
