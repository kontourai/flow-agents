# Dependency install scripts are blocked by default (pnpm >= 10). Only the
# packages listed here, at exactly these versions, may run a build script.
# Every entry is here because something this repo actually runs needs it, not
# because pnpm asked.
allowBuilds:
  # postinstall selects the platform binary; without it esbuild falls back to
  # its slower JS implementation. Needed by the build, which bundles with
  # esbuild. Bump this pin together with the dependency.
  esbuild@0.28.1: true

  # The five below are refused, not merely unlisted. pnpm fails the install on
  # an undeclared build script, so writing the decision out is what keeps it a
  # decision rather than a default.
  #
  # All five arrive under promptfoo, a devDependency used only by the LLM eval
  # layer (`evals/run.sh llm`). Neither CI path needs them: publish-npm.yml runs
  # `evals/run.sh static`, whose suites are shell scripts. promptfoo's own
  # bin is linked either way, because it is a direct devDependency.
  #
  # If you run the LLM eval layer locally and hit a missing native binary, flip
  # the one you need to `true` rather than unblocking the set.
  '@playwright/browser-chromium': false
  '@swc/core': false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# Third-party releases must mature for 24 hours. Kontour packages use their
# source-bound release and consumer qualification instead; the owner explicitly
# exempts the internal namespace while retaining the third-party default.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@kontourai/*'

# mise supplies node and pnpm on developer machines; CI installs the exact
# version pinned in package.json. Do not reject a same-major pnpm from mise.
pmOnFail: ignore
